name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The scaffolder is its own package with no dependencies, so it needs no
      # install of its own. These tests generate every question combination in
      # memory and check the generated imports against the generated
      # package.json; they never touch the network.
      - run: npm test --prefix create-better-content
